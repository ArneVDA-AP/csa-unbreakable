name: security-pipeline
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:   # DSOMM: Test for stored secrets in code (1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks on pushed commits
        run: |
          VER=8.24.3
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz | tar -xz gitleaks
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="origin/main..${{ github.sha }}"
          else
            RANGE="$BEFORE..${{ github.sha }}"
          fi
          echo "Scanning range: $RANGE"
          ./gitleaks git --redact -v --config .gitleaks.toml --log-opts="$RANGE"

  sca:       # DSOMM: Software Composition Analysis (server side) (2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false

  sast:      # DSOMM: Static analysis for important server side components (3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: autobuild
      - uses: github/codeql-action/analyze@v3
      - name: Fail on open high/critical CodeQL alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/code-scanning/alerts?state=open&ref=${{ github.ref }}&per_page=100" \
            --jq '[.[] | select(.rule.security_severity_level=="high" or .rule.security_severity_level=="critical")] | length')
          echo "Open high/critical alerts: $n"
          [ "$n" -eq 0 ]

  deploy:   # DSOMM: Automated deployment process (1), Defined deployment process (1)
    needs: [secrets, sca, sast]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the app
        run: docker compose -p unbreakable up -d --build --remove-orphans
      - name: Show running containers
        run: docker compose ps